 "mat 6:33":[[33, "Mas buscai primeiro o seu reino e a sua justiça, e todas estas coisas vos serão acrescentadas."]],
 "john 14:1-3":[[1, "Não se turbe o vosso coração; credes em Deus, crede também em mim."], [2, "Na casa de meu Pai há muitas moradas; se não fosse assim, eu vo-lo teria dito; vou preparar-vos lugar."], [3, "E, se eu for e vos preparar lugar, virei outra vez, e vos tomarei para mim mesmo, para que onde eu estiver estejais vós também."]],

 "rev 1:7":[[7, "Eis que vem com as nuvens, e todo olho o verá, até mesmo aqueles que o traspassaram; e todas as tribos da terra se lamentarão sobre ele. Sim. Amém."]],
 "act 1:11":[[11, "os quais lhes disseram: Varões galileus, por que ficais aí olhando para o céu? Esse Jesus, que dentre vós foi elevado para o céu, há de vir assim como para o céu o vistes ir."]],
 "2pe 3:10":[[10, "Virá, pois, como ladrão o dia do Senhor, no qual os céus passarão com grande estrondo, e os elementos, ardendo, se dissolverão, e a terra, e as obras que nela há, serão descobertas."]],
 "psa 50:3":[[3, "O nosso Deus vem, e não guarda silêncio; diante dele há um fogo devorador, e grande tormenta ao seu redor."]],
 "1th 4:16-17":[[16, "Porque o Senhor mesmo descerá do céu com grande brado, à voz do arcanjo, ao som da trombeta de Deus, e os que morreram em Cristo ressuscitarão primeiro."], [17, "Depois nós, os que ficarmos vivos seremos arrebatados juntamente com eles, nas nuvens, ao encontro do Senhor nos ares, e assim estaremos para sempre com o Senhor."]],
 "rev 6:15-17":[[15, "E os reis da terra, e os grandes, e os chefes militares, e os ricos, e os poderosos, e todo escravo, e todo livre, se esconderam nas cavernas e nas rochas das montanhas;"], [16, "e diziam aos montes e aos rochedos: Caí sobre nós, e escondei-nos da face daquele que está assentado sobre o trono, e da ira do Cordeiro;"], [17, "porque é vindo o grande dia da ira deles; e quem poderá subsistir?"]],
 "john 5:28-29":[[28, "Não vos admireis disso, porque vem a hora em que todos os que estão nos sepulcros ouvirão a sua voz e sairão:"], [29, "os que tiverem feito o bem, para a ressurreição da vida, e os que tiverem praticado o mal, para a ressurreição do juízo."]],
 "dan 12:2":[[2, "E muitos dos que dormem no pó da terra ressuscitarão, uns para a vida eterna, e outros para vergonha e desprezo eterno."]],
 "rev 20:6":[[6, "Bem-aventurado e santo é aquele que tem parte na primeira ressurreição; sobre estes não tem poder a segunda morte; mas serão sacerdotes de Deus e de Cristo, e reinarão com ele durante os mil anos."]],
 "rev 20:4,6":[[4, "Então vi uns tronos; e aos que se assentaram sobre eles foi dado o poder de julgar; e vi as almas daqueles que foram degolados por causa do testemunho de Jesus e da palavra de Deus, e que não adoraram a besta nem a sua imagem, e não receberam o sinal na fronte nem nas mãos; e reviveram, e reinaram com Cristo durante mil anos."], [6, "Bem-aventurado e santo é aquele que tem parte na primeira ressurreição; sobre estes não tem poder a segunda morte; mas serão sacerdotes de Deus e de Cristo, e reinarão com ele durante os mil anos."]],
 "1co 6:2":[[2, "Ou não sabeis vós que os santos hão de julgar o mundo? Ora, se o mundo há de ser julgado por vós, sois porventura indignos de julgar as coisas mínimas?"]],
 "jer 4:23-26":[[23, "Observei a terra, e eis que era sem forma e vazia; também os céus, e não tinham a sua luz."], [24, "Observei os montes, e eis que estavam tremendo; e todos os outeiros estremeciam."], [25, "Observei e eis que não havia homem algum, e todas as aves do céu tinham fugido."], [26, "Vi também que a terra fértil era um deserto, e todas as suas cidades estavam derrubadas diante do Senhor, diante do furor da sua ira."]],
 "rev 20:1-3":[[1, "E vi descer do céu um anjo, que tinha a chave do abismo e uma grande cadeia na sua mão."], [2, "Ele prendeu o dragão, a antiga serpente, que é o Diabo e Satanás, e o amarrou por mil anos."], [3, "Lançou-o no abismo, o qual fechou e selou sobre ele, para que não enganasse mais as nações até que os mil anos se completassem. Depois disto é necessário que ele seja solto por um pouco de tempo."]],
 "rev 20:5-9":[[5, "Mas os outros mortos não reviveram, até que os mil anos se completassem. Esta é a primeira ressurreição."], [6, "Bem-aventurado e santo é aquele que tem parte na primeira ressurreição; sobre estes não tem poder a segunda morte; mas serão sacerdotes de Deus e de Cristo, e reinarão com ele durante os mil anos."], [7, "Ora, quando se completarem os mil anos, Satanás será solto da sua prisão,"], [8, "e sairá a enganar as nações que estão nos quatro cantos da terra, Gogue e Magogue, cujo número é como a areia do mar, a fim de ajuntá-las para a batalha."], [9, "E subiram sobre a largura da terra, e cercaram o arraial dos santos e a cidade querida; mas desceu fogo do céu, e os devorou;"]],
 "rev 21:2":[[2, "E vi a santa cidade, a nova Jerusalém, que descia do céu da parte de Deus, adereçada como uma noiva ataviada para o seu noivo."]],
 "mat 11:28-29":[[28, "Vinde a mim, todos os que estais cansados e oprimidos, e eu vos aliviarei."], [29, "Tomai sobre vós o meu jugo, e aprendei de mim, que sou manso e humilde de coração; e achareis descanso para as vossas almas."]]
};
var BIBNAME = "João Ferreira de Almeida (domínio público)";

function openBible(list,opener,start){
  bibList=list; bibFocus=opener||document.activeElement;
  var tabs=$("#mtabs");
  tabs.innerHTML = list.length>1 ? list.map(function(x,k){return '<button class="tab" data-k="'+k+'">'+esc(x[0])+'</button>'}).join("") : "";
  tabs.style.display = list.length>1 ? "flex" : "none";
  tabs.querySelectorAll(".tab").forEach(function(b){b.onclick=function(){showRef(+b.dataset.k)}});
  $("#ov").classList.add("on"); $("#ov").setAttribute("aria-hidden","false");
  document.body.classList.add("lock"); bibOpen=true;
  try{history.pushState({bib:1},"")}catch(e){}   // o botão "voltar" do celular fecha o pop-up
  showRef(start||0); $("#mx").focus();
}
function closeBible(fromPop){
  if(!bibOpen) return;
  bibOpen=false;
  $("#ov").classList.remove("on"); $("#ov").setAttribute("aria-hidden","true");
  document.body.classList.remove("lock");
  if(!fromPop){ try{ if(history.state&&history.state.bib) history.back(); }catch(e){} }
  try{ bibFocus&&bibFocus.focus&&bibFocus.focus(); }catch(e){}
}
function showRef(k){
  var item=bibList[k], body=$("#mbody");
  document.querySelectorAll("#mtabs .tab").forEach(function(b,j){b.classList.toggle("sel",j===k)});
  body.scrollTop=0;
  var sb=document.querySelector("#mtabs .tab.sel"); if(sb&&sb.scrollIntoView){ try{sb.scrollIntoView({inline:"center",block:"nearest"})}catch(e){} }
  var vs=BIB[item[1]];
  if(vs) draw(item,vs); else body.innerHTML='<h2>'+esc(item[0])+'</h2><div class="ld">Texto não encontrado.</div>';
}
function draw(item,vs){
  var multi=vs.length>1;
  $("#mbody").innerHTML='<h2>'+esc(item[0])+'</h2>'+vs.map(function(v){return '<p class="vs">'+(multi?'<sup>'+v[0]+'</sup>':'')+esc(v[1])+'</p>'}).join("")+'<div class="ver">Tradução: '+esc(BIBNAME)+'</div>';
}
$("#mx").onclick=function(){closeBible()};
$("#mclose").onclick=function(){closeBible()};
$("#ov").addEventListener("click",function(e){ if(e.target===this) closeBible(); });
document.addEventListener("keydown",function(e){ if(e.key==="Escape"&&bibOpen) closeBible(); });
window.addEventListener("popstate",function(){ if(bibOpen) closeBible(true); });

function render(){
  var i=st.i; tries=0; sel={};
  $("#back").style.visibility = i>0 ? "visible" : "hidden";
  $("#pb").style.width=(Math.max(i,0)/TOTAL*100)+"%";
  $("#cnt").textContent = i<0 ? "" : i<NQ ? (Q[i].recap?"Recapitulação":"Pergunta "+(i+1)+" de "+(NQ-1)) : i===NQ ? "Compromisso de fé" : "Estudo concluído";
  if(i<0){ app.innerHTML='<div class="card"><p class="q">Vamos começar</p><p class="intro">Pense em alguém que prometeu voltar: um pai que viajou, um amigo que se mudou. Cada dia de espera parece uma eternidade, mas a promessa mantém a esperança acesa. Jesus também deixou uma promessa de volta. Quando será? Como será? E o que vem depois?</p><p class="mut">Tente responder cada pergunta. Se errar, é só tentar de novo: você só avança quando acertar. Se ficar difícil, leia o texto bíblico indicado ou peça ajuda ao seu instrutor.</p><button class="btn" id="go">Começar</button></div>'; $("#go").onclick=function(){st.i=0;save();render()}; return; }
  if(i<NQ) return question(Q[i],i);
  if(i===NQ){ app.innerHTML='<div class="card"><p class="q">Compromisso de fé</p><p>Se quiser, marque o que você deseja assumir:</p><label class="chk"><input type="checkbox"><span>Creio que estamos vivendo no tempo do fim.</span></label><label class="chk"><input type="checkbox"><span>Desejo conhecer e praticar a doutrina que está de acordo com toda a Bíblia.</span></label><label class="chk"><input type="checkbox"><span>Creio que haverá duas ressurreições: uma para a vida e outra para a morte eterna.</span></label><label class="chk"><input type="checkbox"><span>Quero me preparar para estar entre os salvos na segunda vinda de Cristo.</span></label><button class="btn" id="nx">Concluir o estudo</button></div>'; $("#nx").onclick=function(){st.i=NQ+1;save();render()}; return; }
  if(!st.d){st.d=1;save();}
  app.innerHTML='<div class="card"><p class="q">Parabéns! Você concluiu o Estudo 4.</p><p>Agora você sabe que a volta de Jesus é certa, como ela será e o que vem depois. O próximo estudo será liberado pelo seu instrutor.</p>'+(st.u?'<p class="msg ok">Estudo 5 liberado!</p><a class="btn" href="'+NEXT_URL+'">Ir para o Estudo 5</a>':'<div class="tc"><input id="uc" placeholder="Código de liberação" autocapitalize="characters"><button class="btn sec" id="ub" style="margin:0">Liberar</button></div><div id="um" class="msg"></div>')+'</div>';
  if(!st.u) $("#ub").onclick=function(){ if($("#uc").value.trim().toUpperCase()===NEXT_CODE){st.u=1;save();render()} else {$("#um").className="msg no";$("#um").textContent="Código incorreto. Peça ao seu instrutor.";tone(BAD)} };
}

function question(q,i){
  var h='<div class="card" id="c"><div class="q">'+(q.recap?q.q:(i+1)+". "+q.q)+'</div>';
  if(q.v) h+='<div class="ref">📖 '+q.v.map(function(x,k){return '<button class="refbtn" data-k="'+k+'">'+esc(x[0])+'</button>'}).join(" · ")+' <span class="mut">· toque para ler</span></div>'; else h+='<div class="ref"></div>';
  var parts={
    p:function(){ var k=0; return '<p class="s">'+q.p.map(function(x){return typeof x==="string"?x:'<input class="b" data-k="'+(k++)+'" autocomplete="off" autocapitalize="off" spellcheck="false" aria-label="Resposta '+k+'">'}).join("")+'</p>'; },
    i:function(){ return (q.s?'<p class="sub">'+q.s+'</p>':'')+q.i.map(function(x,k){return '<div class="row"><span>'+x[0]+'</span><span class="vf" data-k="'+k+'"><button data-v="1" aria-label="Verdadeiro">V</button><button data-v="0" aria-label="Falso">F</button></span></div>'}).join(""); },
    o:function(){ return q.o.map(function(x,k){return '<button class="opt" data-k="'+k+'">'+x+'</button>'}).join(""); }
  };
  (q.ord||"poi").split("").forEach(function(c){ if(q[c]) h+=parts[c](); });
  h+='<div id="fb"></div><button class="btn" id="ck">Verificar</button></div>';
  app.innerHTML=h;
  document.querySelectorAll(".refbtn").forEach(function(b){b.onclick=function(){openBible(q.v,b,+b.dataset.k)}});
  document.querySelectorAll(".vf button").forEach(function(b){b.onclick=function(){var p=b.parentNode;p.querySelectorAll("button").forEach(function(x){x.classList.remove("sel")});b.classList.add("sel");sel[p.dataset.k]=+b.dataset.v}});
  document.querySelectorAll(".opt").forEach(function(b){b.onclick=function(){document.querySelectorAll(".opt").forEach(function(x){x.classList.remove("sel")});b.classList.add("sel");sel.c=+b.dataset.k}});
  $("#ck").onclick=function(){check(q,i)};
  document.querySelectorAll("input.b").forEach(function(f){f.addEventListener("keydown",function(e){if(e.key==="Enter")check(q,i)})});
  var sa=st.a&&st.a[i]; if(sa){ putAns(q,sa); check(q,i,true); }
}

function canonAns(q){ var a={}; if(q.p) a.f=q.p.filter(function(x){return typeof x!=="string"}).map(function(x){return x[0]}); if(q.i){ a.v={}; q.i.forEach(function(x,k){ a.v[k]=x[1]; }); } if(q.o) a.c=q.c; return a; }
function readAns(q){ var a={}; if(q.p) a.f=[].map.call(document.querySelectorAll("input.b"),function(x){return x.value}); if(q.i){ a.v={}; q.i.forEach(function(x,k){ if(sel[k]!==undefined) a.v[k]=sel[k]; }); } if(q.o&&sel.c!==undefined) a.c=sel.c; return a; }
function putAns(q,a){
  if(a.f) [].forEach.call(document.querySelectorAll("input.b"),function(x,k){ x.value=a.f[k]||""; });
  if(a.v) Object.keys(a.v).forEach(function(k){ sel[k]=a.v[k]; var g=document.querySelector('.vf[data-k="'+k+'"]'); if(g) g.querySelectorAll("button").forEach(function(b){ b.classList.toggle("sel",+b.dataset.v===a.v[k]); }); });
  if(a.c!==undefined){ sel.c=a.c; document.querySelectorAll(".opt").forEach(function(b){ b.classList.toggle("sel",+b.dataset.k===a.c); }); }
}
function answerText(q){
  var a=[];
  if(q.p) a.push(q.p.filter(function(x){return typeof x!=="string"}).map(function(x){return x[0]}).join(" · "));
  if(q.i) a.push(q.i.map(function(x){return (x[1]?"V":"F")}).join(" · "));
  if(q.o) a.push(q.o[q.c]);
  return a.join(" | ");
}
function check(q,i,silent){
  var ok=true, fb=$("#fb"), card=$("#c");
  if(q.p){ var k=0; q.p.forEach(function(x){ if(typeof x==="string")return; var inp=document.querySelector('input[data-k="'+(k++)+'"]'); var v=norm(inp.value); var good=!!v&&accepted(x).some(function(a){return match(v,a)}); inp.classList.toggle("ok",good); inp.classList.toggle("no",!good); if(!good) ok=false; }); }
  if(q.i){ q.i.forEach(function(x,k){ var g=document.querySelector('.vf[data-k="'+k+'"]'); var good=sel[k]===x[1]; g.classList.toggle("ok",good); g.classList.toggle("no",!good); if(!good) ok=false; }); }
  if(q.o){ document.querySelectorAll(".opt").forEach(function(b){b.classList.remove("ok","no")}); var b=document.querySelector('.opt[data-k="'+sel.c+'"]'); if(sel.c===undefined) ok=false; else { b.classList.add(sel.c===q.c?"ok":"no"); if(sel.c!==q.c) ok=false; } }
  if(ok) return acerto(q,i,silent);
  if(silent) return;
  tries++; tone(BAD); try{navigator.vibrate&&navigator.vibrate([80,60,80])}catch(e){}
  card.classList.remove("shake"); void card.offsetWidth; card.classList.add("shake");
  var m='<div class="msg no">Ainda não. Releia o texto e tente de novo.</div>';
  if(tries>=2) m+='<div class="hint">💡 Dica: '+q.h+'</div>';
  if(tries>=3) m+='<button class="btn sec" id="ti">Chamar o instrutor</button><div id="tb"></div>';
  fb.innerHTML=m;
  if(tries>=3) $("#ti").onclick=function(){ $("#tb").innerHTML='<div class="tc"><input id="tcd" type="password" placeholder="Código do instrutor"><button class="btn sec" id="tok" style="margin:0">OK</button></div><div id="tr"></div>'; $("#tok").onclick=function(){ if($("#tcd").value===TEACHER_CODE){ $("#tr").innerHTML='<div class="note">Resposta: '+answerText(q)+'</div><button class="btn" id="sk">Seguir adiante</button>'; $("#sk").onclick=function(){ st.a=st.a||{}; st.a[i]=canonAns(q); avancar(); }; } else {$("#tr").innerHTML='<div class="msg no">Código incorreto.</div>';tone(BAD)} } };
}
function acerto(q,i,silent){
  if(!silent){ st.a=st.a||{}; st.a[i]=readAns(q); save(); tone(GOOD); }
  document.querySelectorAll("input.b,.opt,.vf button").forEach(function(x){x.disabled=true});
  var h='<div class="msg ok">Muito bem! ✔</div>'+(q.n?'<div class="note">'+q.n+'</div>':'')+'<button class="btn" id="nx">'+(i===NQ-1?"Continuar":"Próxima pergunta")+'</button>';
  $("#fb").innerHTML=h; $("#ck").style.display="none"; $("#nx").onclick=avancar; if(!silent) $("#nx").focus();
}
function avancar(){ st.i++; save(); render(); window.scrollTo({top:0,behavior:"smooth"}); }

function voltar(){ if(st.i<=0) return; closeBible(); st.i--; save(); render(); window.scrollTo({top:0,behavior:"smooth"}); }
$("#back").onclick=voltar;
$("#mute").onclick=function(){muted=!muted;this.textContent=muted?"🔇 Som desligado":"🔊 Som ligado"};
$("#reset").onclick=function(){ st={i:-1,u:0}; save(); render(); };
render();
</script>
