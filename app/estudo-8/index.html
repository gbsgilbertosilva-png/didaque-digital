// Cada resposta: [texto exibido, trechos aceitos...]  (sem acento, minúsculas; "=" no início = palavra exata)

  h:"Leia o último versículo de cada aba: ele soma os anos de vida de cada um.",

 {q:"Mesmo permitindo o uso da carne, que orientação o Senhor deu?",

 {q:"Por que Deus se preocupa com a nossa alimentação?",

 {q:"Recapitulação", recap:1,

];
var NQ = Q.length, TOTAL = NQ + 2;
var $ = function(s){return document.querySelector(s)}, app = $("#app");
var st = {i:-1,u:0}; try{var sv=JSON.parse(localStorage.getItem(KEY)); if(sv) st=sv;}catch(e){}

var muted=false, tries=0, sel={}, ac;

function norm(s){return String(s).toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/[^a-z0-9 ]/g," ").replace(/\s+/g," ").trim()}
function match(v,a){ if(a.charAt(0)==="=") return (" "+v+" ").indexOf(" "+norm(a.slice(1))+" ")>-1; return v.indexOf(norm(a))>-1; }
function accepted(x){ return x.length>1 ? x.slice(1) : x; }
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
function tone(seq){ if(muted) return; try{ ac=ac||new (window.AudioContext||window.webkitAudioContext)(); var t=ac.currentTime;
  seq.forEach(function(n){var o=ac.createOscillator(),g=ac.createGain();o.type=n[2]||"sine";o.frequency.value=n[0];g.gain.setValueAtTime(.16,t);g.gain.exponentialRampToValueAtTime(.001,t+n[1]);o.connect(g);g.connect(ac.destination);o.start(t);o.stop(t+n[1]);t+=n[1]+.06}); }catch(e){} }
var BAD=[[190,.18,"square"],[150,.3,"square"]], GOOD=[[660,.12],[880,.22]];

var bibOpen=false, bibList=[], bibFocus=null;
// ====== TEXTOS BÍBLICOS (ficam dentro do aplicativo, funcionam sem internet) ======

var BIB = {"gen 1:29-30": [[29, "E disse Deus: Eis que vos tenho dado toda a erva que dá semente e que está sobre a face de toda a terra, e toda a árvore em que há fruto de árvore que dê semente; ser-vos-á para mantimento."], [30, "E a todo o animal da terra, e a toda a ave dos céus, e a tudo o que se move sobre a terra, em que há alma vivente, toda a erva verde será para mantimento. E assim foi."]], "gen 5:5": [[5, "E foram todos os dias que Adão viveu novecentos e trinta anos; e morreu."]], "gen 5:8": [[8, "E foram todos os dias de Sete novecentos e doze anos; e morreu."]], "gen 5:27": [[27, "E foram todos os dias de Matusalém novecentos e sessenta e nove anos; e morreu."]], "gen 9:3-4": [[3, "Tudo o que se move e vive vos será para mantimento; tudo vos tenho dado como a erva verde."], [4, "Verdadeiramente, porém, a carne com a sua vida, que é o seu sangue, não comereis."]], "gen 7:2": [[2, "De todo o animal limpo tomarás para ti sete e sete, o macho e sua fêmea; mas dos animais imundos, dois, o macho e sua fêmea."]], "lev 11:47": [[47, "Para fazer diferença entre o imundo e o limpo, e entre os animais que se podem comer e os animais que não se podem comer."]], "lev 11:2-3": [[2, "Falai aos filhos de Israel, dizendo: Estes são os animais que comereis de todos os animais que há sobre a terra:"], [3, "Todo o que tem unhas fendidas, e que fende a unha em duas, e que rumina entre os animais, esse comereis."]], "lev 11:9-10": [[9, "Estes comereis de tudo o que há nas águas: tudo o que tem barbatanas e escamas nas águas, nos mares e nos rios, esse comereis."], [10, "Mas tudo o que não tem barbatanas nem escamas, nos mares e nos rios, entre tudo o que se move nas águas e entre tudo o que vive nas águas, abominação será para vós."]], "pro 20:1": [[1, "O vinho é escarnecedor, e a bebida forte alvoroçadora; e todo aquele que nisso errar não será sábio."]], "pro 23:29-35": [[29, "Para quem são os ais? Para quem os pesares? Para quem as pelejas? Para quem as queixas? Para quem as feridas sem causa? E para quem os olhos vermelhos?"], [30, "Para os que se demoram perto do vinho, para os que andam buscando vinho misturado."], [31, "Não olhes para o vinho quando se mostra vermelho, quando resplandece no copo, e se escoa suavemente."], [32, "No fim, picará como a cobra, e morderá como o basilisco."], [33, "Os teus olhos olharão para as mulheres estranhas, e o teu coração falará perversidades."], [34, "E serás como o que se deita no meio do mar, ou como o que se deita no topo do mastro."], [35, "Ferirem-me-ão, dirás, mas não me doerá; bateram-me, mas não o senti; quando despertarei? Aí tornarei a buscá-lo outra vez."]], "1co 6:19-20": [[19, "Ou não sabeis que o vosso corpo é o templo do Espírito Santo, que habita em vós, proveniente de Deus, e que não sois de vós mesmos?"], [20, "Porque fostes comprados por bom preço; glorificai, pois, a Deus no vosso corpo, e no vosso espírito, os quais pertencem a Deus."]], "3jo 2": [[2, "Amado, desejo que te vá bem em todas as coisas, e que tenhas saúde, assim como bem vai a tua alma."]], "exo 15:26": [[26, "E disse: Se ouvires atentamente a voz do Senhor teu Deus, e fizeres o que é reto diante de seus olhos, e deres ouvidos aos seus mandamentos, e guardares todos os seus estatutos, nenhuma enfermidade te porei, das que enviei sobre os egípcios; porque eu sou o Senhor, que te sara."]], "act 17:30": [[30, "Mas Deus, não tendo em conta os tempos da ignorância, anuncia agora a todos os homens, em todo o lugar, que se arrependam;"]], "jas 4:17": [[17, "Aquele, pois, que sabe fazer o bem e o não faz, comete pecado."]]};
var BIBNAME = "Almeida (domínio público) · confira na sua Bíblia em caso de dúvida";

function openBible(list,opener,start){
  bibList=list; bibFocus=opener||document.activeElement;
  var tabs=$("#mtabs");
  tabs.innerHTML = list.length>1 ? list.map(function(x,k){return '<button class="tab" data-k="'+k+'">'+esc(x[0])+'</button>'}).join("") : "";
  tabs.style.display = list.length>1 ? "flex" : "none";
  tabs.querySelectorAll(".tab").forEach(function(b){b.onclick=function(){showRef(+b.dataset.k)}});
  $("#ov").classList.add("on"); $("#ov").setAttribute("aria-hidden","false");
  document.body.classList.add("lock"); bibOpen=true;
  try{history.pushState({bib:1},"")}catch(e){}   // o botão "voltar" do celular fecha o pop-up
  showRef(start||0); $("#mx").focus();
}
function closeBible(fromPop){
  if(!bibOpen) return;
  bibOpen=false;
  $("#ov").classList.remove("on"); $("#ov").setAttribute("aria-hidden","true");
  document.body.classList.remove("lock");
  if(!fromPop){ try{ if(history.state&&history.state.bib) history.back(); }catch(e){} }
  try{ bibFocus&&bibFocus.focus&&bibFocus.focus(); }catch(e){}
}
function showRef(k){
  var item=bibList[k], body=$("#mbody");
  document.querySelectorAll("#mtabs .tab").forEach(function(b,j){b.classList.toggle("sel",j===k)});
  body.scrollTop=0;
  var sb=document.querySelector("#mtabs .tab.sel"); if(sb&&sb.scrollIntoView){ try{sb.scrollIntoView({inline:"center",block:"nearest"})}catch(e){} }
  var vs=BIB[item[1]];
  if(vs) draw(item,vs); else body.innerHTML='<h2>'+esc(item[0])+'</h2><div class="ld">Texto não encontrado.</div>';
}
function draw(item,vs){
  var multi=vs.length>1;
  $("#mbody").innerHTML='<h2>'+esc(item[0])+'</h2>'+vs.map(function(v){return '<p class="vs">'+(multi?'<sup>'+v[0]+'</sup>':'')+esc(v[1])+'</p>'}).join("")+'<div class="ver">Tradução: '+esc(BIBNAME)+'</div>';
}

  $("#back").style.visibility = i>0 ? "visible" : "hidden";
  $("#pb").style.width=(Math.max(i,0)/TOTAL*100)+"%";
  $("#cnt").textContent = i<0 ? "" : i<NQ ? (Q[i].recap?"Recapitulação":"Pergunta "+(i+1)+" de "+(NQ-1)) : i===NQ ? "Compromisso de fé" : "Estudo concluído";
  if(i<0){ app.innerHTML='<div class="card"><p class="q">Vamos começar</p><p class="intro">Quem compra uma máquina cara costuma ler o manual do fabricante antes de usá-la. Só que ninguém nasce com o manual do próprio corpo. A Bíblia guarda o que o Criador recomendou, e começa pelo cardápio que Ele mesmo serviu na primeira refeição da história.</p><p class="mut">Tente responder cada pergunta. Se errar, é só tentar de novo: você só avança quando acertar. Se ficar difícil, leia o texto bíblico indicado ou peça ajuda ao seu instrutor.</p><button class="btn" id="go">Começar</button></div>'; $("#go").onclick=function(){st.i=0;save();render()}; return; }
  if(i<NQ) return question(Q[i],i);
  if(i===NQ){ app.innerHTML='<div class="card"><p class="q">Compromisso de fé</p><p>Se quiser, marque o que você deseja assumir:</p><label class="chk"><input type="checkbox"><span>Reconheço que o meu corpo é o templo do Espírito Santo.</span></label><label class="chk"><input type="checkbox"><span>Desejo fazer a minha parte para ter mais saúde.</span></label><label class="chk"><input type="checkbox"><span>Quero, a partir de hoje, me alimentar de acordo com o ensino bíblico.</span></label><button class="btn" id="nx">Concluir o estudo</button></div>'; $("#nx").onclick=function(){st.i=NQ+1;save();render()}; return; }
  if(!st.d){st.d=1;save();}
  app.innerHTML='<div class="card"><p class="q">Parabéns! Você concluiu o Estudo 8.</p><p>Agora você sabe o que a Bíblia ensina sobre cuidar do corpo, que é o templo do Espírito Santo. O próximo estudo será liberado pelo seu instrutor.</p>'+(st.u?'<p class="msg ok">Estudo 9 liberado!</p><a class="btn" href="'+NEXT_URL+'">Ir para o Estudo 9</a>':'<div class="tc"><input id="uc" placeholder="Código de liberação" autocapitalize="characters"><button class="btn sec" id="ub" style="margin:0">Liberar</button></div><div id="um" class="msg"></div>')+'</div>';
  if(!st.u) $("#ub").onclick=function(){ if($("#uc").value.trim().toUpperCase()===NEXT_CODE){st.u=1;save();render()} else {$("#um").className="msg no";$("#um").textContent="Código incorreto. Peça ao seu instrutor.";tone(BAD)} };
}

function question(q,i){
  var h='<div class="card" id="c"><div class="q">'+(q.recap?q.q:(i+1)+". "+q.q)+'</div>';
  if(q.v) h+='<div class="ref">📖 '+q.v.map(function(x,k){return '<button class="refbtn" data-k="'+k+'">'+esc(x[0])+'</button>'}).join(" · ")+' <span class="mut">· toque para ler</span></div>'; else h+='<div class="ref"></div>';
  var parts={
    p:function(){ var k=0; return '<p class="s">'+q.p.map(function(x){return typeof x==="string"?x:'<input class="b" data-k="'+(k++)+'" autocomplete="off" autocapitalize="off" spellcheck="false" aria-label="Resposta '+k+'">'}).join("")+'</p>'; },
    i:function(){ return (q.s?'<p class="sub">'+q.s+'</p>':'')+q.i.map(function(x,k){return '<div class="row"><span>'+x[0]+'</span><span class="vf" data-k="'+k+'"><button data-v="1" aria-label="Verdadeiro">V</button><button data-v="0" aria-label="Falso">F</button></span></div>'}).join(""); },
    o:function(){ return q.o.map(function(x,k){return '<button class="opt" data-k="'+k+'">'+x+'</button>'}).join(""); }
  };
  (q.ord||"poi").split("").forEach(function(c){ if(q[c]) h+=parts[c](); });
  h+='<div id="fb"></div><button class="btn" id="ck">Verificar</button></div>';
  app.innerHTML=h;
  document.querySelectorAll(".refbtn").forEach(function(b){b.onclick=function(){openBible(q.v,b,+b.dataset.k)}});
  document.querySelectorAll(".vf button").forEach(function(b){b.onclick=function(){var p=b.parentNode;p.querySelectorAll("button").forEach(function(x){x.classList.remove("sel")});b.classList.add("sel");sel[p.dataset.k]=+b.dataset.v}});
  document.querySelectorAll(".opt").forEach(function(b){b.onclick=function(){document.querySelectorAll(".opt").forEach(function(x){x.classList.remove("sel")});b.classList.add("sel");sel.c=+b.dataset.k}});
  $("#ck").onclick=function(){check(q,i)};
  document.querySelectorAll("input.b").forEach(function(f){f.addEventListener("keydown",function(e){if(e.key==="Enter")check(q,i)})});
  var sa=st.a&&st.a[i]; if(sa){ putAns(q,sa); check(q,i,true); }
}

function canonAns(q){ var a={}; if(q.p) a.f=q.p.filter(function(x){return typeof x!=="string"}).map(function(x){return x[0]}); if(q.i){ a.v={}; q.i.forEach(function(x,k){ a.v[k]=x[1]; }); } if(q.o) a.c=q.c; return a; }
function readAns(q){ var a={}; if(q.p) a.f=[].map.call(document.querySelectorAll("input.b"),function(x){return x.value}); if(q.i){ a.v={}; q.i.forEach(function(x,k){ if(sel[k]!==undefined) a.v[k]=sel[k]; }); } if(q.o&&sel.c!==undefined) a.c=sel.c; return a; }
function putAns(q,a){
  if(a.f) [].forEach.call(document.querySelectorAll("input.b"),function(x,k){ x.value=a.f[k]||""; });
  if(a.v) Object.keys(a.v).forEach(function(k){ sel[k]=a.v[k]; var g=document.querySelector('.vf[data-k="'+k+'"]'); if(g) g.querySelectorAll("button").forEach(function(b){ b.classList.toggle("sel",+b.dataset.v===a.v[k]); }); });
  if(a.c!==undefined){ sel.c=a.c; document.querySelectorAll(".opt").forEach(function(b){ b.classList.toggle("sel",+b.dataset.k===a.c); }); }
}
function answerText(q){
  var a=[];
  if(q.p) a.push(q.p.filter(function(x){return typeof x!=="string"}).map(function(x){return x[0]}).join(" · "));
  if(q.i) a.push(q.i.map(function(x){return (x[1]?"V":"F")}).join(" · "));
  if(q.o) a.push(q.o[q.c]);
  return a.join(" | ");
}
function check(q,i,silent){
  var ok=true, fb=$("#fb"), card=$("#c");
  if(q.p){ var k=0; q.p.forEach(function(x){ if(typeof x==="string")return; var inp=document.querySelector('input[data-k="'+(k++)+'"]'); var v=norm(inp.value); var good=!!v&&accepted(x).some(function(a){return match(v,a)}); inp.classList.toggle("ok",good); inp.classList.toggle("no",!good); if(!good) ok=false; }); }
  if(q.i){ q.i.forEach(function(x,k){ var g=document.querySelector('.vf[data-k="'+k+'"]'); var good=sel[k]===x[1]; g.classList.toggle("ok",good); g.classList.toggle("no",!good); if(!good) ok=false; }); }
  if(q.o){ document.querySelectorAll(".opt").forEach(function(b){b.classList.remove("ok","no")}); var b=document.querySelector('.opt[data-k="'+sel.c+'"]'); if(sel.c===undefined) ok=false; else { b.classList.add(sel.c===q.c?"ok":"no"); if(sel.c!==q.c) ok=false; } }
  if(ok) return acerto(q,i,silent);
  if(silent) return;
  tries++; tone(BAD); try{navigator.vibrate&&navigator.vibrate([80,60,80])}catch(e){}
  card.classList.remove("shake"); void card.offsetWidth; card.classList.add("shake");
  var m='<div class="msg no">Ainda não. Releia o texto e tente de novo.</div>';
  if(tries>=2) m+='<div class="hint">💡 Dica: '+q.h+'</div>';
  if(tries>=3) m+='<button class="btn sec" id="ti">Chamar o instrutor</button><div id="tb"></div>';
  fb.innerHTML=m;
  if(tries>=3) $("#ti").onclick=function(){ $("#tb").innerHTML='<div class="tc"><input id="tcd" type="password" placeholder="Código do instrutor"><button class="btn sec" id="tok" style="margin:0">OK</button></div><div id="tr"></div>'; $("#tok").onclick=function(){ if($("#tcd").value===TEACHER_CODE){ $("#tr").innerHTML='<div class="note">Resposta: '+answerText(q)+'</div><button class="btn" id="sk">Seguir adiante</button>'; $("#sk").onclick=function(){ st.a=st.a||{}; st.a[i]=canonAns(q); avancar(); }; } else {$("#tr").innerHTML='<div class="msg no">Código incorreto.</div>';tone(BAD)} } };
}
function acerto(q,i,silent){
  if(!silent){ st.a=st.a||{}; st.a[i]=readAns(q); save(); tone(GOOD); }
  document.querySelectorAll("input.b,.opt,.vf button").forEach(function(x){x.disabled=true});
  var h='<div class="msg ok">Muito bem! ✔</div>'+(q.n?'<div class="note">'+q.n+'</div>':'')+'<button class="btn" id="nx">'+(i===NQ-1?"Continuar":"Próxima pergunta")+'</button>';
  $("#fb").innerHTML=h; $("#ck").style.display="none"; $("#nx").onclick=avancar; if(!silent) $("#nx").focus();
}
function avancar(){ st.i++; save(); render(); window.scrollTo({top:0,behavior:"smooth"}); }

function voltar(){ if(st.i<=0) return; closeBible(); st.i--; save(); render(); window.scrollTo({top:0,behavior:"smooth"}); }
$("#back").onclick=voltar;
$("#mute").onclick=function(){muted=!muted;this.textContent=muted?"🔇 Som desligado":"🔊 Som ligado"};
$("#reset").onclick=function(){ st={i:-1,u:0}; save(); render(); };
render();
</script>
<script type="module" src="../comum/didaque.js"></script>
