<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel do Instrutor - Didaquê Digital</title>
    <style>
        /* Estilos básicos para a página e o Card de Login */
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f9;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        #main {
            width: 100%;
            max-width: 400px;
            padding: 20px;
        }
        .card {
            background: #ffffff;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            text-align: center;
        }
        .btn {
            background-color: #4285F4;
            color: white;
            border: none;
            padding: 12px 24px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 4px;
            cursor: pointer;
            width: 100%;
            margin-top: 15px;
            transition: background 0.2s;
        }
        .btn:hover {
            background-color: #357ae8;
        }
        .msg {
            color: #d93025;
            font-size: 14px;
            margin-top: 15px;
            min-height: 20px;
        }
        .mut {
            color: #666;
            font-size: 12px;
            margin-top: 20px;
            line-height: 1.4;
        }
    </style>
</head>
<body>

    <!-- Elemento principal onde a tela de login será injetada -->
    <div id="main">Carregando...</div>

    <!-- 1. Importação do Firebase (Utilizando a versão de compatibilidade para facilitar o uso direto no HTML) -->
    <script src="https://gstatic.com"></script>
    <script src="https://gstatic.com"></script>

    <script>
        // 2. Atalho para o seletor \$, simulando o comportamento que você usou no seu código
        const \$ = (seletor) => document.querySelector(seletor);
        const main = \$("#main");

        // 3. ATENÇÃO: Substitua os dados abaixo pelas credenciais do SEU projeto Firebase
        const firebaseConfig = {
            apiKey: "SUA_API_KEY_AQUI",
            authDomain: "SEU_AUTH_DOMAIN_AQUI",
            projectId: "SEU_PROJECT_ID_AQUI",
            storageBucket: "SEU_STORAGE_BUCKET_AQUI",
            messagingSenderId: "SEU_MESSAGING_SENDER_ID_AQUI",
            appId: "SEU_APP_ID_AQUI"
        };

        // Inicializa o Firebase
        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const GoogleAuthProvider = firebase.auth.GoogleAuthProvider;
        const signInWithPopup = (authInstance, provider) => authInstance.signInWithPopup(provider);

        // 4. Sua função corrigida e ajustada
        function telaLogin() {
            main.innerHTML = `
                <div class="card">
                    <p>Entre com a sua conta Google para criar classes e acompanhar os alunos.</p>
                    <button class="btn" id="g">Entrar com Google</button>
                    <div id="m" class="msg"></div>
                    <p class="mut">Dica: abra esta página no navegador (Chrome). Dentro de alguns aplicativos o login do Google não funciona.</p>
                </div>
            `;

            \$("#g").onclick = async () => {
                try { 
                    await signInWithPopup(auth, new GoogleAuthProvider()); 
                    \$("#m").style.color = "green";
                    \$("#m").textContent = "Login efetuado com sucesso!";
                    // Aqui você pode redirecionar o usuário ou chamar a tela principal do painel
                } catch (e) { 
                    console.error(e); 
                    \$("#m").style.color = "#d93025";
                    \$("#m").textContent = "Não foi possível entrar. Se a janela do Google foi bloqueada, permita pop-ups e tente de novo."; 
                }
            };
        }

        // Executa a função para desenhar a tela na inicialização
        telaLogin();
    </script>
</body>
</html>
