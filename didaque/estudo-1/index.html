<!DOCTYPE html>
<html lang="pt-BR">
<head>

<title>Estudo 1 · A Bíblia</title>
<style>
:root{--bg:#FFF8E7;--card:#fff;--tx:#222;--mut:#666;--navy:#1F3A5F;--qc:#1F3A5F;--or:#E07B39;--teal:#2A7F8E;--ok:#2E7D32;--bad:#C62828;--line:#E6D9B8;--inp:#FDF1D8;--gold:#F4B43C;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}

:root[data-theme="dark"]{--bg:#0F1B2D;--card:#172A45;--tx:#EDEFF2;--mut:#A9B4C4;--navy:#14263F;--qc:#C9DAF5;--or:#F0914F;--teal:#6CC6D3;--ok:#66BB6A;--bad:#EF5350;--line:#2B4466;--inp:#1E3556}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:17px/1.55 Calibri,"Segoe UI",system-ui,sans-serif}
body.lock{overflow:hidden}
.wrap{max-width:640px;margin:0 auto;padding:0 14px 40px}
.hero{background:radial-gradient(circle at 88% 20%,#f4b43c55,transparent 45%),linear-gradient(135deg,var(--navy),#2c527f);color:#fff;margin:0 -14px 14px;padding:22px 22px 20px;border-radius:0 0 24px 24px}
.hero small{color:var(--gold);letter-spacing:.3em;font-weight:700;font-size:13px}
.hero .n{font:700 56px/1 Georgia,serif;color:#F0914F;margin-top:2px}
.hero h1{font:700 30px/1.15 Georgia,serif;margin:4px 0 0}
.bar{height:8px;background:var(--line);border-radius:6px;overflow:hidden;margin:6px 0 4px}
.bar i{display:block;height:100%;width:0;background:var(--or);transition:width .4s}
.cnt{font-size:14px;color:var(--mut);margin-bottom:10px}
.card{background:var(--card);border-radius:14px;padding:18px;border:1px solid var(--line);border-left:6px solid var(--or)}
.q{font:700 19px/1.35 Georgia,serif;color:var(--qc)}
.ref{margin:8px 0 14px}
.refbtn{font:inherit;font-weight:700;color:var(--teal);background:transparent;border:0;border-bottom:2px dotted var(--teal);padding:2px 0;cursor:pointer;text-align:left}
.s{line-height:2.3;margin:0}
input.b{font:inherit;border:2px solid var(--line);background:var(--inp);color:var(--tx);border-radius:8px;padding:1px 8px;width:9em;max-width:100%}
input.ok,.opt.ok{border-color:var(--ok)!important;background:color-mix(in srgb,var(--ok) 15%,transparent)!important}
input.no,.opt.no{border-color:var(--bad)!important}
.opt{display:block;width:100%;text-align:left;font:inherit;color:var(--tx);background:var(--card);padding:11px 12px;border:2px solid var(--line);border-radius:10px;margin:8px 0;cursor:pointer}
.opt.sel{border-color:var(--or)}
.row{display:flex;justify-content:space-between;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}
.vf{display:flex;gap:6px;flex:none}
.vf button{width:44px;height:44px;border-radius:50%;border:2px solid var(--line);background:var(--card);color:var(--tx);font:700 16px inherit;cursor:pointer}
.vf button.sel{background:var(--or);border-color:var(--or);color:#fff}
.vf.ok button.sel{background:var(--ok);border-color:var(--ok)}
.vf.no button.sel{background:var(--bad);border-color:var(--bad)}
.btn{background:var(--or);color:#fff;border:0;border-radius:12px;padding:13px 22px;font:700 17px inherit;cursor:pointer;margin-top:16px}
a.btn{display:inline-block;text-decoration:none}
.btn.sec{background:transparent;color:var(--teal);border:2px solid var(--teal);padding:9px 16px;font-size:15px;margin-top:10px}
.btn:focus-visible,.opt:focus-visible,.vf button:focus-visible,input:focus-visible,a:focus-visible,.refbtn:focus-visible,.xbtn:focus-visible,.tab:focus-visible{outline:3px solid var(--teal);outline-offset:2px}
.msg{margin-top:12px;font-weight:700}.msg.ok{color:var(--ok)}.msg.no{color:var(--bad)}
.hint,.note{margin-top:10px;padding:10px 12px;border-radius:10px;background:var(--inp);font-size:15px}
.note{border-left:4px solid var(--teal)}
.shake{animation:sh .35s}
@keyframes sh{20%,60%{transform:translateX(-7px)}40%,80%{transform:translateX(7px)}}
.foot{display:flex;flex-wrap:wrap;gap:4px;justify-content:space-between;margin-top:18px;font-size:14px;color:var(--mut)}
.foot a.home{color:var(--mut);text-decoration:underline;padding:6px}
.foot button{background:none;border:0;color:var(--mut);font:inherit;text-decoration:underline;cursor:pointer;padding:6px}
.tc{display:flex;gap:8px;margin-top:8px}.tc input{flex:1;min-width:0;font:inherit;padding:8px;border-radius:8px;border:2px solid var(--line);background:var(--inp);color:var(--tx)}
.chk{display:flex;gap:10px;align-items:flex-start;padding:8px 0}.chk input{width:22px;height:22px;margin-top:3px;accent-color:var(--or)}

/* ===== Pop-up do texto bíblico ===== */
.ov{position:fixed;inset:0;z-index:100;display:none;align-items:flex-end;justify-content:center;background:rgba(10,20,40,.6);-webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px)}
.ov.on{display:flex;animation:fd .2s}
.md{background:var(--card);color:var(--tx);width:100%;max-width:640px;max-height:84vh;max-height:84dvh;display:flex;flex-direction:column;overflow:hidden;border-radius:24px 24px 0 0;border-top:6px solid var(--or);box-shadow:0 -10px 40px rgba(0,0,0,.35);animation:up .28s ease-out}
.mh{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:14px 12px 8px 20px}
.mh b{font:700 13px/1 Calibri,system-ui,sans-serif;letter-spacing:.2em;color:var(--or);text-transform:uppercase}
.xbtn{flex:none;width:44px;height:44px;border-radius:50%;border:0;background:var(--inp);color:var(--tx);font:400 26px/1 system-ui,sans-serif;cursor:pointer;display:flex;align-items:center;justify-content:center}
.tabs{display:flex;gap:8px;padding:0 20px 8px;overflow-x:auto}
.tab{flex:none;font:inherit;font-weight:700;font-size:15px;color:var(--teal);background:transparent;border:2px solid var(--teal);border-radius:999px;padding:6px 14px;cursor:pointer}
.tab.sel{background:var(--teal);color:#fff}
.mb{padding:6px 20px 12px;overflow-y:auto;-webkit-overflow-scrolling:touch;min-height:120px}
.mb h2{font:700 24px/1.2 Georgia,serif;color:var(--qc);margin:4px 0 12px}
.vs{font:20px/1.75 Georgia,serif;margin:0 0 10px}
.vs sup{font:700 12px Calibri,system-ui,sans-serif;color:var(--or);margin-right:3px}
.ver{font-size:13px;color:var(--mut);margin-top:12px}
.ld{color:var(--mut);padding:24px 0;text-align:center}
.mf{padding:6px 20px calc(16px + env(safe-area-inset-bottom,0px))}
.mf .btn{width:100%;margin-top:6px}
@keyframes up{from{transform:translateY(40px);opacity:0}to{transform:none;opacity:1}}
@keyframes fd{from{opacity:0}to{opacity:1}}
@media (min-width:700px){.ov{align-items:center}.md{border-radius:24px;max-height:80vh}.mf{padding-bottom:18px}}
@media (prefers-reduced-motion:reduce){.shake,.md,.ov.on{animation:none}.bar i{transition:none}}
</style>
</head>
<body>
<div class="wrap">
  <div class="hero"><small>ESTUDO</small><div class="n">1</div><h1>A Bíblia</h1></div>

  <div class="cnt" id="cnt"></div>
  <main id="app"></main>
  <div class="foot"><button id="mute">🔊 Som ligado</button><a class="home" href="../">Início</a><button id="back" aria-label="Voltar à pergunta anterior">← Voltar</button><button id="reset">Recomeçar</button></div>
</div>

<!-- Pop-up do texto bíblico -->
<div class="ov" id="ov" aria-hidden="true">

<script>
// ====== CONFIGURAÇÃO (edite aqui) ======
var TEACHER_CODE = "1234";   // código do instrutor (mostra a resposta)
var NEXT_CODE = "ESTUDO2";   // código que libera o próximo estudo
var NEXT_URL = "../estudo-2/"; // endereço da página do Estudo 2
var KEY = "didaque_e1_v1";

// Cada resposta: [texto exibido, trechos aceitos...]  (sem acento, minúsculas)
// v: lista de textos bíblicos do pop-up [título, consulta]
var Q = [
 {q:"Como Jesus considerava a Bíblia?", r:"João 17:17", v:[["João 17:17","john 17:17"]], t:"fill",
  p:["Santifica-os na verdade, a Tua Palavra é a ",["verdade"],"."], h:"Leia João 17:17 com atenção: Jesus fala da Palavra de Deus como a ..."},
 {q:"Qual é a situação de muitos estudantes da Bíblia, e o que necessitam para entendê-la?", r:"Atos 8:26-31", v:[["Atos 8:26-31","act 8:26-31"]], t:"fill",
  p:["Estudam e não ",["entendem","entend","compreend"],". Para entendê-la, alguém precisa ",["me ensinar","ensin","guia","explic","orient"],"."], h:"Releia os versos 30 e 31: o etíope precisava de alguém que o ..."},
 {q:"Qual é a maneira correta de estudar a Bíblia?", r:"Isaías 28:10", v:[["Isaías 28:10","isaiah 28:10"]], t:"vf",
  i:[["Comparar os textos que tratam do mesmo assunto.",1],["Buscar outras passagens que explicam o assunto.",1],["Estudar sem pedir a orientação do Espírito Santo.",0],["Um pouco aqui, e um pouco ali sobre o mesmo assunto.",1]], h:"Marque V ou F em cada frase. Pense: o Espírito Santo nos ajuda a entender?"},
 {q:"Que benefício recebe o estudante das Escrituras?", r:"João 5:39", v:[["João 5:39","john 5:39"]], t:"fill",
  p:["Através da Bíblia, encontramos a vida ",["eterna","etern"],". Ela testifica de ",["Jesus","jesus","cristo"],"."], h:"Leia João 5:39: as Escrituras dão testemunho de quem?",
  n:"Jesus é o personagem central da Bíblia. Cada página revela Seu amor e Seu desejo de nos salvar."},
 {q:"Que outro benefício prático advém de examinar a Bíblia?", r:"João 16:13; 8:32", v:[["João 16:13","john 16:13"],["João 8:32","john 8:32"]], t:"fill",
  p:["O Espírito Santo guia em toda a ",["verdade"],". E é a verdade que nos ",["liberta","libert"],"."], h:"Os dois textos falam de verdade. A verdade nos faz o quê?"},
 {q:"Quem dirigiu os profetas ao escreverem a Bíblia?", r:"2 Pedro 1:21", v:[["2 Pedro 1:21","2 peter 1:21"]], t:"fill",
  p:["Homens santos falaram da parte de Deus, pelo ",["Espírito","espirito"]," Santo."], h:"Leia 2 Pedro 1:21: quem os movia?"},
 {q:"Quanto do texto bíblico é inspirado por Deus?", r:"2 Timóteo 3:16", v:[["2 Timóteo 3:16","2 timothy 3:16"]], t:"vf",
  i:[["Somente o Antigo Testamento.",0],["Somente o Novo Testamento.",0],["Toda a Bíblia é inspirada por Deus.",1]], h:"O texto diz “toda a Escritura”.",
  n:"A Bíblia é útil para o ensino, a repreensão, a correção e a educação na justiça. Lendo-a, nosso caráter é transformado."},
 {q:"Que parte da Bíblia não foi escrita por autores humanos?", r:"Êxodo 31:18", v:[["Êxodo 31:18","exodus 31:18"]], t:"choice",
  o:["Os Dez Mandamentos","Os Salmos","O livro de Gênesis"], c:0, h:"O verso fala de tábuas de pedra escritas pelo dedo de Deus."},
 {q:"Está alguém autorizado a alterar a Bíblia?", r:"Malaquias 3:6; Apocalipse 22:18, 19", v:[["Malaquias 3:6","malachi 3:6"],["Apocalipse 22:18-19","revelation 22:18-19"]], t:"choice",
  o:["Sim, se achar necessário","Não: nada se deve acrescentar nem tirar"], c:1, h:"Leia Apocalipse 22:18 e 19."},
 {q:"Como são chamados os praticantes dos ensinos bíblicos?", r:"João 13:17; Tiago 1:22", v:[["João 13:17","john 13:17"],["Tiago 1:22","james 1:22"]], t:"fill",
  p:["Bem ",["aventurados","aventurado","feliz"]," se praticardes os ",["ensinos","ensin","mandamento"]," da Bíblia."], h:"João 13:17: “bem-...” se o praticardes."},
 {q:"Recapitulação", recap:1, t:"fill",
  p:["Para Jesus, a Palavra de Deus é a fonte da ",["verdade"],". Muitos estudam a ",["Bíblia","biblia"]," e não ",["entendem","entend"],". A forma correta de estudar é um ",["pouco"]," aqui e um pouco ",["ali"],", sobre o mesmo ",["assunto"],". Toda a Bíblia é inspirada por ",["Deus","deus"],". Não podemos ",["tirar","tira","retir","diminuir", "diminu"]," nem ",["acrescentar","acrescent"]," nada às Escrituras."], h:"Use as respostas que você já deu nas perguntas."}
];
var NQ = Q.length, TOTAL = NQ + 2;
var $ = function(s){return document.querySelector(s)}, app = $("#app");
var st = {i:-1,u:0}; try{var sv=JSON.parse(localStorage.getItem(KEY)); if(sv) st=sv;}catch(e){}
function save(){try{localStorage.setItem(KEY,JSON.stringify(st))}catch(e){}}
var muted=false, quiet=false, tries=0, sel={}, ac;

function norm(s){return String(s).toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/[^a-z0-9 ]/g," ").replace(/\s+/g," ").trim()}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
function tone(seq){ if(muted||quiet) return; try{ ac=ac||new (window.AudioContext||window.webkitAudioContext)(); var t=ac.currentTime;
  seq.forEach(function(n){var o=ac.createOscillator(),g=ac.createGain();o.type=n[2]||"sine";o.frequency.value=n[0];g.gain.setValueAtTime(.16,t);g.gain.exponentialRampToValueAtTime(.001,t+n[1]);o.connect(g);g.connect(ac.destination);o.start(t);o.stop(t+n[1]);t+=n[1]+.06}); }catch(e){} }
var BAD=[[190,.18,"square"],[150,.3,"square"]], GOOD=[[660,.12],[880,.22]];

/* ===== Pop-up bíblico ===== */
var bibOpen=false, bibList=[], bibFocus=null;
// ====== TEXTOS BÍBLICOS (ficam dentro do aplicativo, funcionam sem internet) ======
// Tradução atual: João Ferreira de Almeida (domínio público).
// Para trocar por outra tradução, basta substituir o texto de cada versículo abaixo.
// Formato: "chave": [ [número do versículo, "texto"], ... ]
var BIB = {
 "john 17:17":[[17,"Santifica-os na verdade, a tua palavra é a verdade."]],
 "act 8:26-31":[
  [26,"Mas um anjo do Senhor falou a Filipe, dizendo: Levanta-te, e vai em direção do sul pelo caminho que desce de Jerusalém a Gaza, o qual está deserto."],
  [27,"E levantou-se e foi; e eis que um etíope, eunuco, mordomo-mor de Candace, rainha dos etíopes, o qual era superintendente de todos os seus tesouros e tinha ido a Jerusalém para adorar,"],
  [28,"regressava e, sentado no seu carro, lia o profeta Isaías."],
  [29,"Disse o Espírito a Filipe: Chega-te e ajunta-te a esse carro."],
  [30,"E correndo Filipe, ouviu que lia o profeta Isaías, e disse: Entendes, porventura, o que estás lendo?"],
  [31,"Ele respondeu: Pois como poderei entender, se alguém não me ensinar? e rogou a Filipe que subisse e com ele se sentasse."]],
 "isaiah 28:10":[[10,"Pois é preceito sobre preceito, preceito sobre preceito; regra sobre regra, regra sobre regra; um pouco aqui, um pouco ali."]],
 "john 5:39":[[39,"Examinais as Escrituras, porque julgais ter nelas a vida eterna; e são elas que dão testemunho de mim;"]],
 "john 16:13":[[13,"Quando vier, porém, aquele, o Espírito da verdade, ele vos guiará a toda a verdade; porque não falará por si mesmo, mas dirá o que tiver ouvido, e vos anunciará as coisas vindouras."]],
 "john 8:32":[[32,"e conhecereis a verdade, e a verdade vos libertará."]],
 "2 peter 1:21":[[21,"Porque a profecia nunca foi produzida por vontade dos homens, mas os homens da parte de Deus falaram movidos pelo Espírito Santo."]],
 "2 timothy 3:16":[[16,"Toda Escritura é divinamente inspirada e proveitosa para ensinar, para repreender, para corrigir, para instruir em justiça;"]],
 "exodus 31:18":[[18,"E deu a Moisés, quando acabou de falar com ele no monte Sinai, as duas tábuas do testemunho, tábuas de pedra, escritas pelo dedo de Deus."]],
 "malachi 3:6":[[6,"Pois eu, o Senhor, não mudo; por isso vós, ó filhos de Jacó, não sois consumidos."]],
 "revelation 22:18-19":[
  [18,"Eu testifico a todo aquele que ouvir as palavras da profecia deste livro: Se alguém lhes acrescentar alguma coisa, Deus lhe acrescentará as pragas que estão escritas neste livro;"],
  [19,"e se alguém tirar qualquer coisa das palavras do livro desta profecia, Deus lhe tirará a sua parte da árvore da vida, e da cidade santa, que estão descritas neste livro."]],
 "john 13:17":[[17,"Se sabeis estas coisas, bem-aventurados sois se as praticardes."]],
 "james 1:22":[[22,"E sede cumpridores da palavra e não somente ouvintes, enganando-vos a vós mesmos."]]
};
var BIBNAME = "João Ferreira de Almeida (domínio público)";

function openBible(list,opener){
  bibList=list; bibFocus=opener||document.activeElement;
  var tabs=$("#mtabs");
  tabs.innerHTML = list.length>1 ? list.map(function(x,k){return '<button class="tab" data-k="'+k+'">'+esc(x[0])+'</button>'}).join("") : "";
  tabs.style.display = list.length>1 ? "flex" : "none";
  tabs.querySelectorAll(".tab").forEach(function(b){b.onclick=function(){showRef(+b.dataset.k)}});
  $("#ov").classList.add("on"); $("#ov").setAttribute("aria-hidden","false");
  document.body.classList.add("lock"); bibOpen=true;
  try{history.pushState({bib:1},"")}catch(e){}   // o botão "voltar" do celular fecha o pop-up
  showRef(0); $("#mx").focus();
}
function closeBible(fromPop){
  if(!bibOpen) return;
  bibOpen=false;
  $("#ov").classList.remove("on"); $("#ov").setAttribute("aria-hidden","true");
  document.body.classList.remove("lock");
  if(!fromPop){ try{ if(history.state&&history.state.bib) history.back(); }catch(e){} }
  try{ bibFocus&&bibFocus.focus&&bibFocus.focus(); }catch(e){}
}
function showRef(k){
  var item=bibList[k], body=$("#mbody");
  document.querySelectorAll("#mtabs .tab").forEach(function(b,j){b.classList.toggle("sel",j===k)});
  body.scrollTop=0;
  var vs=BIB[item[1]];
  if(vs) draw(item,vs); else body.innerHTML='<h2>'+esc(item[0])+'</h2><div class="ld">Texto não encontrado.</div>';
}
function draw(item,vs){
  var multi=vs.length>1;
  $("#mbody").innerHTML='<h2>'+esc(item[0])+'</h2>'+vs.map(function(v){return '<p class="vs">'+(multi?'<sup>'+v[0]+'</sup>':'')+esc(v[1])+'</p>'}).join("")+'<div class="ver">Tradução: '+esc(BIBNAME)+'</div>';
}
$("#mx").onclick=function(){closeBible()};
$("#mclose").onclick=function(){closeBible()};
$("#ov").addEventListener("click",function(e){ if(e.target===this) closeBible(); });
document.addEventListener("keydown",function(e){ if(e.key==="Escape"&&bibOpen) closeBible(); });
window.addEventListener("popstate",function(){ if(bibOpen) closeBible(true); });

function render(){
  var i=st.i; tries=0; sel={};
  $("#pb").style.width=(Math.max(i,0)/TOTAL*100)+"%";
  $("#back").style.visibility = i>0 ? "visible" : "hidden";
  $("#cnt").textContent = i<0 ? "" : i<NQ ? (Q[i].recap?"Recapitulação":"Pergunta "+(i+1)+" de "+(NQ-1)) : i===NQ ? "Compromisso de fé" : "Estudo concluído";
  if(i<0){ app.innerHTML='<div class="card"><p class="q">Vamos estudar a Palavra de Deus</p><p>Tente responder cada pergunta. Se errar, é só tentar de novo: você só avança quando acertar. Se ficar difícil, leia o texto bíblico indicado ou peça ajuda ao seu instrutor. <p>A Bíblia é um livro diferente: uma pequena biblioteca de 66 livros, escritos por cerca de 40 autores, de culturas e ocupações muito variadas, ao longo de 1.600 anos. Muitas pessoas tiveram a vida transformada por suas verdades. O que torna a Bíblia tão especial? De onde vem seu poder? Que valor ela tem para as pessoas hoje?<p> </p><button class="btn" id="go">Começar</button></div>'; $("#go").onclick=function(){st.i=0;save();render()}; return; }
  if(i<NQ) return question(Q[i],i);
  if(i===NQ){ app.innerHTML='<div class="card"><p class="q">Compromisso de fé</p><p>Se quiser, marque o que você deseja assumir:</p><label class="chk"><input type="checkbox"><span>Aceito toda a Bíblia como regra de fé para minha vida.</span></label><label class="chk"><input type="checkbox"><span>Quero dedicar tempo cada dia para estudar a Bíblia.</span></label><label class="chk"><input type="checkbox"><span>Farei todo o possível para colocar em prática seus ensinos em minha vida.</span></label><button class="btn" id="nx">Concluir o estudo</button></div>'; $("#nx").onclick=function(){st.i=NQ+1;save();render()}; return; }
  if(!st.d){st.d=1;save();}
  app.innerHTML='<div class="card"><p class="q">Parabéns! Você concluiu o Estudo 1.</p><p>Agora você sabe por que a Bíblia é diferente de qualquer outro livro. O próximo estudo será liberado pelo seu instrutor.</p>'+(st.u?'<p class="msg ok">Estudo 2 liberado!</p><a class="btn" href="'+NEXT_URL+'">Ir para o Estudo 2</a>':'<div class="tc"><input id="uc" placeholder="Código de liberação" autocapitalize="characters"><button class="btn sec" id="ub" style="margin:0">Liberar</button></div><div id="um" class="msg"></div>')+'</div>';
  if(!st.u) $("#ub").onclick=function(){ if($("#uc").value.trim().toUpperCase()===NEXT_CODE){st.u=1;save();render()} else {$("#um").className="msg no";$("#um").textContent="Código incorreto. Peça ao seu instrutor.";tone(BAD)} };
}

function question(q,i){
  var h='<div class="card" id="c"><div class="q">'+(q.recap?q.q:(i+1)+". "+q.q)+'</div>';
  if(q.r) h+='<div class="ref"><button class="refbtn" id="rb">📖 '+q.r+' · ler texto</button></div>'; else h+='<div class="ref"></div>';
  if(q.t==="fill"){ var k=0; h+='<p class="s">'+q.p.map(function(x){return typeof x==="string"?x:'<input class="b" data-k="'+(k++)+'" autocomplete="off" autocapitalize="off" spellcheck="false" aria-label="Resposta '+k+'">'}).join("")+'</p>'; }
  if(q.t==="vf") h+=q.i.map(function(x,k){return '<div class="row"><span>'+x[0]+'</span><span class="vf" data-k="'+k+'"><button data-v="1" aria-label="Verdadeiro">V</button><button data-v="0" aria-label="Falso">F</button></span></div>'}).join("");
  if(q.t==="choice") h+=q.o.map(function(x,k){return '<button class="opt" data-k="'+k+'">'+x+'</button>'}).join("");
  h+='<div id="fb"></div><button class="btn" id="ck">Verificar</button></div>';
  app.innerHTML=h;
  var rb=$("#rb"); if(rb) rb.onclick=function(){openBible(q.v,rb)};
  document.querySelectorAll(".vf button").forEach(function(b){b.onclick=function(){var p=b.parentNode;p.querySelectorAll("button").forEach(function(x){x.classList.remove("sel")});b.classList.add("sel");sel[p.dataset.k]=+b.dataset.v}});
  document.querySelectorAll(".opt").forEach(function(b){b.onclick=function(){document.querySelectorAll(".opt").forEach(function(x){x.classList.remove("sel")});b.classList.add("sel");sel.c=+b.dataset.k}});
  $("#ck").onclick=function(){check(q,i)};
  var f=document.querySelector("input.b"); if(f) f.addEventListener("keydown",function(e){if(e.key==="Enter")check(q,i)});
  var sa=st.a&&st.a[i]; if(sa){ putAns(q,sa); check(q,i,true); }
  if(i<(st.m||0)){ // revisão: pergunta já respondida volta preenchida, pronta para ler e seguir
    quiet=true;
    if(q.t==="fill"){ var n=0; q.p.forEach(function(x){ if(typeof x==="string")return; document.querySelector('input[data-k="'+(n++)+'"]').value=x[0]; }); }
    if(q.t==="vf"){ q.i.forEach(function(x,k){ sel[k]=x[1]; document.querySelector('.vf[data-k="'+k+'"] button[data-v="'+x[1]+'"]').classList.add("sel"); }); }
    if(q.t==="choice"){ sel.c=q.c; document.querySelector('.opt[data-k="'+q.c+'"]').classList.add("sel"); }
    check(q,i); quiet=false;
  }
}

function canonAns(q){ var a={}; if(q.p) a.f=q.p.filter(function(x){return typeof x!=="string"}).map(function(x){return x[0]}); if(q.i){ a.v={}; q.i.forEach(function(x,k){ a.v[k]=x[1]; }); } if(q.o) a.c=q.c; return a; }
function readAns(q){ var a={}; if(q.p) a.f=[].map.call(document.querySelectorAll("input.b"),function(x){return x.value}); if(q.i){ a.v={}; q.i.forEach(function(x,k){ if(sel[k]!==undefined) a.v[k]=sel[k]; }); } if(q.o&&sel.c!==undefined) a.c=sel.c; return a; }
function putAns(q,a){
  if(a.f) [].forEach.call(document.querySelectorAll("input.b"),function(x,k){ x.value=a.f[k]||""; });
  if(a.v) Object.keys(a.v).forEach(function(k){ sel[k]=a.v[k]; var g=document.querySelector('.vf[data-k="'+k+'"]'); if(g) g.querySelectorAll("button").forEach(function(b){ b.classList.toggle("sel",+b.dataset.v===a.v[k]); }); });
  if(a.c!==undefined){ sel.c=a.c; document.querySelectorAll(".opt").forEach(function(b){ b.classList.toggle("sel",+b.dataset.k===a.c); }); }
}
function answerText(q){
  if(q.t==="fill") return q.p.filter(function(x){return typeof x!=="string"}).map(function(a){return a[0]}).join(" · ");
  if(q.t==="vf") return q.i.map(function(x){return (x[1]?"V":"F")}).join(" · ");
  return q.o[q.c];
}
function check(q,i,silent){
  var ok=true, fb=$("#fb"), card=$("#c");
  if(q.t==="fill"){ var k=0; q.p.forEach(function(x){ if(typeof x==="string")return; var inp=document.querySelector('input[data-k="'+(k++)+'"]'); var v=norm(inp.value); var good=v&&x.some(function(a){return v.indexOf(norm(a))>-1}); inp.classList.toggle("ok",!!good); inp.classList.toggle("no",!good); if(!good) ok=false; }); }
  if(q.t==="vf"){ q.i.forEach(function(x,k){ var g=document.querySelector('.vf[data-k="'+k+'"]'); var good=sel[k]===x[1]; g.classList.toggle("ok",good&&sel[k]!==undefined); g.classList.toggle("no",!good); if(!good) ok=false; }); }
  if(q.t==="choice"){ document.querySelectorAll(".opt").forEach(function(b){b.classList.remove("ok","no")}); var b=document.querySelector('.opt[data-k="'+sel.c+'"]'); if(sel.c===undefined) ok=false; else { b.classList.add(sel.c===q.c?"ok":"no"); if(sel.c!==q.c) ok=false; } }
  if(ok) return acerto(q,i,silent);
  if(silent) return;
  tries++; tone(BAD); try{navigator.vibrate&&navigator.vibrate([80,60,80])}catch(e){}
  card.classList.remove("shake"); void card.offsetWidth; card.classList.add("shake");
  var m='<div class="msg no">Ainda não. Releia o texto e tente de novo.</div>';
  if(tries>=2) m+='<div class="hint">💡 Dica: '+q.h+'</div>';
  if(tries>=3) m+='<button class="btn sec" id="ti">Chamar o instrutor</button><div id="tb"></div>';
  fb.innerHTML=m;
  if(tries>=3) $("#ti").onclick=function(){ $("#tb").innerHTML='<div class="tc"><input id="tcd" type="password" placeholder="Código do instrutor"><button class="btn sec" id="tok" style="margin:0">OK</button></div><div id="tr"></div>'; $("#tok").onclick=function(){ if($("#tcd").value===TEACHER_CODE){ $("#tr").innerHTML='<div class="note">Resposta: '+answerText(q)+'</div><button class="btn" id="sk">Seguir adiante</button>'; $("#sk").onclick=function(){ st.a=st.a||{}; st.a[i]=canonAns(q); avancar(); }; } else {$("#tr").innerHTML='<div class="msg no">Código incorreto.</div>';tone(BAD)} } };
}
function acerto(q,i,silent){
  if(!silent){ st.a=st.a||{}; st.a[i]=readAns(q); save(); tone(GOOD); }
  document.querySelectorAll("input.b,.opt,.vf button").forEach(function(x){x.disabled=true});
  var h='<div class="msg ok">Muito bem! ✔</div>'+(q.n?'<div class="note">'+q.n+'</div>':'')+'<button class="btn" id="nx">'+(i===NQ-1?"Continuar":"Próxima pergunta")+'</button>';
  $("#fb").innerHTML=h; $("#ck").style.display="none"; $("#nx").onclick=avancar; if(!silent) $("#nx").focus();
}
function avancar(){ st.i++; if(st.i>(st.m||0)) st.m=st.i; save(); render(); window.scrollTo({top:0,behavior:"smooth"}); }

function voltar(){ if(st.i<=0) return; closeBible(); st.i--; save(); render(); window.scrollTo({top:0,behavior:"smooth"}); }
$("#back").onclick=voltar;
$("#mute").onclick=function(){muted=!muted;this.textContent=muted?"🔇 Som desligado":"🔊 Som ligado"};
$("#reset").onclick=function(){ st={i:-1,u:0}; save(); render(); };
render();
</script>
</body>
</html>
