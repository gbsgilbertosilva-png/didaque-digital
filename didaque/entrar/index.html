<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Entrar na classe · Didaquê Digital</title>
<style>
:root{--bg:#FFF8E7;--card:#fff;--tx:#222;--mut:#666;--navy:#1F3A5F;--or:#E07B39;--teal:#2A7F8E;--bad:#C62828;--line:#E6D9B8;--inp:#FDF1D8;--gold:#F4B43C}
@media (prefers-color-scheme:dark){:root{--bg:#0F1B2D;--card:#172A45;--tx:#EDEFF2;--mut:#A9B4C4;--navy:#14263F;--or:#F0914F;--teal:#6CC6D3;--bad:#EF5350;--line:#2B4466;--inp:#1E3556}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:17px/1.55 Calibri,"Segoe UI",system-ui,sans-serif;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.wrap{max-width:520px;margin:0 auto;padding:0 14px 40px}
.hero{background:radial-gradient(circle at 88% 20%,#f4b43c55,transparent 45%),linear-gradient(135deg,var(--navy),#2c527f);color:#fff;margin:0 -14px 18px;padding:28px 22px 24px;border-radius:0 0 24px 24px}
.hero h1{font:700 32px/1.1 Georgia,serif;margin:0 0 6px}
.hero p{margin:0;opacity:.92}
.card{background:var(--card);border:1px solid var(--line);border-left:6px solid var(--or);border-radius:14px;padding:18px}
label{display:block;font-weight:700;margin:12px 0 4px}
input{width:100%;font:inherit;padding:12px;border:2px solid var(--line);border-radius:10px;background:var(--inp);color:var(--tx)}
input.cod{text-transform:uppercase;letter-spacing:.2em;font-weight:700;font-size:20px;text-align:center}
.btn{display:block;width:100%;text-align:center;background:var(--or);color:#fff;border:0;border-radius:12px;padding:14px;font:700 18px inherit;cursor:pointer;margin-top:18px;text-decoration:none}
.btn.sec{background:transparent;color:var(--teal);border:2px solid var(--teal);font-size:16px;padding:10px}
.msg{margin-top:12px;font-weight:700;color:var(--bad)}
.mut{color:var(--mut);font-size:15px}
a.back{display:inline-block;margin-top:16px;color:var(--mut)}
</style>
</head>
<body>
<div class="wrap">
  <div class="hero"><h1>Entrar na classe</h1><p>Use o código que o seu instrutor te passou.</p></div>
  <div class="card" id="box">Carregando…</div>
  <a class="back" href="../">← Voltar ao início</a>
</div>
<script type="module">
import { auth, db } from "../comum/fb.js";
import { signInAnonymously } from "https://www.gstatic.com/firebasejs/12.13.0/firebase-auth.js";
import { doc, getDoc, setDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/12.13.0/firebase-firestore.js";

const $ = s => document.querySelector(s), box = $("#box");
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const atual = () => { try { return JSON.parse(localStorage.getItem("didaque_aluno")); } catch (e) { return null; } };

function tela() {
  const a = atual();
  if (a && a.classe) {
    box.innerHTML = '<p>Você está na classe <b>' + esc(a.classe) + '</b> como <b>' + esc(a.nome) + '</b>.</p>' +
      '<a class="btn" href="../estudos/">Continuar os estudos</a>' +
      '<button class="btn sec" id="trocar">Entrar em outra classe</button>';
    $("#trocar").onclick = () => { localStorage.removeItem("didaque_aluno"); tela(); };
    return;
  }
  box.innerHTML = '<label for="nome">Seu nome</label><input id="nome" autocomplete="given-name" maxlength="30">' +
    '<label for="cod">Código da classe</label><input id="cod" class="cod" maxlength="8" autocapitalize="characters" autocomplete="off" spellcheck="false">' +
    '<div id="m" class="msg"></div><button class="btn" id="ok">Entrar</button>' +
    '<p class="mut" style="margin-bottom:0">Só pedimos o seu nome para o instrutor acompanhar o seu estudo.</p>';
  $("#ok").onclick = () => entrar();
  $("#cod").addEventListener("keydown", e => { if (e.key === "Enter") entrar(); });
}

const slug = x => String(x).toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "").replace(/[^a-z0-9]+/g, "-").replace(/^-+|-+$/g, "").slice(0, 30) || "aluno";

async function entrar(confirmado) {
  const nome = $("#nome").value.trim();
  const cod = $("#cod").value.trim().toUpperCase().replace(/[^A-Z0-9]/g, "");
  const m = $("#m"), ok = $("#ok");
  if (!nome || cod.length < 4) { m.textContent = "Preencha o seu primeiro nome e o código da classe."; return; }
  ok.disabled = true; m.textContent = "";
  try {
    await auth.authStateReady();
    const u = auth.currentUser || (await signInAnonymously(auth)).user;
    const c = await getDoc(doc(db, "classes", cod));
    if (!c.exists()) { m.textContent = "Código não encontrado. Confira com o seu instrutor."; ok.disabled = false; return; }
    const id = slug(nome), ref = doc(db, "classes", cod, "alunos", id);
    const ex = await getDoc(ref);
    if (ex.exists() && confirmado !== true) {
      m.innerHTML = 'Já existe um aluno chamado <b>' + esc(nome) + '</b> nesta classe. É você voltando?' +
        '<div style="margin-top:8px"><button class="btn" id="sim" style="margin-top:0">Sou eu, continuar</button>' +
        '<button class="btn sec" id="nao">Não sou eu</button></div>';
      $("#sim").onclick = () => entrar(true);
      $("#nao").onclick = () => { m.textContent = "Use o primeiro nome e a inicial do sobrenome, por exemplo: João P."; ok.disabled = false; };
      return;
    }
    const dados = { nome: nome, uid: u.uid, atualizadoEm: serverTimestamp() };
    if (!ex.exists()) dados.entrouEm = serverTimestamp();
    await setDoc(ref, dados, { merge: true });
    localStorage.setItem("didaque_aluno", JSON.stringify({ classe: cod, nome: nome, id: id }));
    location.href = "../estudos/";
  } catch (e) {
    console.error(e);
    m.textContent = "Não foi possível entrar. Verifique a internet e tente de novo. (" + (e.code || e.message) + ")";
    ok.disabled = false;
  }
}
tela();
</script>
</body>
</html>
